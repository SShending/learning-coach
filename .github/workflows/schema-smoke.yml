name: Vault schema, skill architecture, and plugin release smoke test

on:
  push:
    paths:
      - "references/**"
      - "skills/**"
      - "evals/**"
      - "scripts/**"
      - "docs/**"
      - "README.md"
      - "README.zh-CN.md"
      - "CONTEXT.md"
      - ".app.json"
      - ".codex-plugin/plugin.json"
      - ".github/workflows/schema-smoke.yml"
  pull_request:
    paths:
      - "references/**"
      - "skills/**"
      - "evals/**"
      - "scripts/**"
      - "docs/**"
      - "README.md"
      - "README.zh-CN.md"
      - "CONTEXT.md"
      - ".app.json"
      - ".codex-plugin/plugin.json"
      - ".github/workflows/schema-smoke.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validator
        run: python -m pip install "jsonschema>=4.23,<5" "referencing>=0.35,<1"
      - name: Validate schemas and dispatcher routing
        run: python scripts/validate_vault_schemas.py
      - name: Validate skill architecture and routing contracts
        run: python scripts/check_skill_architecture.py
      - name: Validate learning acceleration policy contracts
        run: python scripts/check_learning_acceleration.py
      - name: Validate cross-Topic reuse contracts
        run: python scripts/check_cross_topic_reuse.py
      - name: Validate Inbox resurfacing contract
        run: python scripts/check_inbox_resurfacing.py
      - name: Validate Research Coach contracts
        run: python scripts/check_research_coach.py
      - name: Validate plugin release package
        run: python scripts/check_plugin_release.py
      - name: Validate personal plugin installer syntax
        run: bash -n scripts/install_personal_plugin.sh
