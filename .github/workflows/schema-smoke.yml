name: Vault schema and skill architecture smoke test

on:
  push:
    paths:
      - "references/**"
      - "skills/**"
      - "scripts/validate_vault_schemas.py"
      - "scripts/check_skill_architecture.py"
      - "README.md"
      - "README.zh-CN.md"
      - "CONTEXT.md"
      - "docs/chatgpt-project.md"
      - "docs/companion-skills.md"
      - ".codex-plugin/plugin.json"
      - ".github/workflows/schema-smoke.yml"
  pull_request:
    paths:
      - "references/**"
      - "skills/**"
      - "scripts/validate_vault_schemas.py"
      - "scripts/check_skill_architecture.py"
      - "README.md"
      - "README.zh-CN.md"
      - "CONTEXT.md"
      - "docs/chatgpt-project.md"
      - "docs/companion-skills.md"
      - ".codex-plugin/plugin.json"
      - ".github/workflows/schema-smoke.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validator
        run: python -m pip install "jsonschema>=4.23,<5" "referencing>=0.35,<1"
      - name: Validate schemas and dispatcher routing
        run: python scripts/validate_vault_schemas.py
      - name: Validate skill architecture and routing contracts
        run: python scripts/check_skill_architecture.py
