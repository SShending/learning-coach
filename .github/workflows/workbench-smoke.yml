name: Workbench smoke test

on:
  push:
    paths:
      - "workbench.html"
      - "scripts/check_workbench.py"
      - ".github/workflows/workbench-smoke.yml"
  pull_request:
    paths:
      - "workbench.html"
      - "scripts/check_workbench.py"
      - ".github/workflows/workbench-smoke.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Workbench V1/V2 routing and JavaScript syntax
        run: python scripts/check_workbench.py
